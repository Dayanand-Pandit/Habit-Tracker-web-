<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Habit Tracker</title>

<meta name="description" content="A simple, colorful daily habit and routine tracker." />
<meta name="theme-color" content="#4F46E5" />

<!-- PWA / installability -->
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon-192.png" />
<link rel="apple-touch-icon" href="icon-180.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Habits" />
<meta name="mobile-web-app-capable" content="yes" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">

<link rel="stylesheet" href="habit.css" />
</head>
<body>

<div class="app-frame" id="appFrame">

  <!-- Material top app bar -->
  <header class="app-bar">
    <h1 class="app-bar-title">Habit Tracker

    </h1>
    <button id="installIconBtn" class="icon-btn" title="Install app" hidden aria-label="Install app">
      <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M12 3v10.2l3.6-3.6 1.4 1.4-6 6-6-6 1.4-1.4 3.6 3.6V3h2zM5 19h14v2H5z"/></svg>
    </button>
  </header>

  <!-- Install banner -->
  <div class="install-banner" id="installBanner" hidden>
    <svg viewBox="0 0 24 24" width="22" height="22" class="banner-icon"><path fill="currentColor" d="M12 3v10.2l3.6-3.6 1.4 1.4-6 6-6-6 1.4-1.4 3.6 3.6V3h2zM5 19h14v2H5z"/></svg>
    <span class="banner-text" id="bannerText">Install this app on your device for quick access</span>
    <button class="banner-btn" id="installBannerBtn">Install</button>
    <button class="banner-close" id="installBannerClose" aria-label="Dismiss">✕</button>
  </div>

  <!-- Screens -->
  <main class="screens" id="screens">

    <!-- TODAY -->
    <section class="screen active" id="screen-today">
      <div class="date-header">
        <h2 class="date-line" id="dateLine">Stay consistent!</h2>
        <p class="date-sub">Stay consistent, build your streak!</p>
      </div>

      <div class="progress-card">
        <div class="progress-card-top">
          <span class="progress-count" id="progressCount">0/0</span>
          <span class="progress-pct" id="progressPct">0%</span>
        </div>
        <div class="progress-track">
          <div class="progress-fill" id="progressFill"></div>
        </div>
      </div>

      <div class="section-row">
        <h2 class="section-title">Today's Habits</h2>
        <button class="text-btn danger" id="resetTodayBtn">Reset</button>
      </div>

      <div id="habitList" class="habit-list"></div>

      <div class="empty-state" id="emptyState" hidden>
        <div class="empty-emoji">✨</div>
        <p>No habits yet.</p>
        <p class="empty-sub">Tap the + button to add your first habit.</p>
      </div>
    </section>

    <!-- CALENDAR -->
    <section class="screen" id="screen-calendar">
      <h2 class="section-title">Calendar</h2>

      <div class="month-nav">
        <button class="icon-btn ghost" id="prevMonthBtn" aria-label="Previous month">
          <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M15 6l-6 6 6 6 1.4-1.4L11.8 12l4.6-4.6z"/></svg>
        </button>
        <span class="month-label" id="monthLabel">—</span>
        <button class="icon-btn ghost" id="nextMonthBtn" aria-label="Next month">
          <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M9 6l6 6-6 6-1.4-1.4L12.2 12 7.6 7.4z"/></svg>
        </button>
        <button class="chip" id="todayJumpBtn">Today</button>
      </div>

      <div class="weekday-row" id="weekdayRow"></div>
      <div class="calendar-grid" id="calendarGrid"></div>

      <div class="legend">
        <span class="legend-label">Less</span>
        <span class="swatch" style="background:#FFB4AB"></span>
        <span class="swatch" style="background:#FFD39A"></span>
        <span class="swatch" style="background:#FFE58A"></span>
        <span class="swatch" style="background:#25d30e"></span>
        <span class="swatch" style="background:#c2c7c5"></span>
        <span class="legend-label">More</span>
      </div>
    </section>

    <!-- PROGRESS -->
    <section class="screen" id="screen-progress">
      <div class="section-row">
        <h2 class="section-title">Progress</h2>
        <button class="text-btn danger" id="resetAllBtn">Reset all</button>
      </div>

      <div class="stat-grid" id="statGrid"></div>

      <div class="chart-card">
        <h3 class="chart-title">Last 14 Days</h3>
        <canvas id="chartCanvas"></canvas>
      </div>
    </section>

  </main>

  <!-- FAB -->
  <button class="fab" id="fab" aria-label="Add habit">
    <svg viewBox="0 0 24 24" width="26" height="26"><path fill="currentColor" d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6z"/></svg>
  </button>

  <!-- Bottom navigation -->
  <nav class="bottom-nav">
    <button class="nav-item active" data-screen="today" aria-label="Today">
      <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M9 16.2L4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/></svg>
      <span>Today</span>
    </button>
    <button class="nav-item" data-screen="calendar" aria-label="Calendar">
      <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M19 4h-1V2h-2v2H8V2H6v2H5a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2V6a2 2 0 00-2-2zm0 16H5V10h14zM5 8V6h14v2z"/></svg>
      <span>Calendar</span>
    </button>
    <button class="nav-item" data-screen="progress" aria-label="Progress">
      <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M5 9h3v11H5zm6-5h3v16h-3zm6 8h3v8h-3z"/></svg>
      <span>Progress</span>
    </button>
  </nav>

</div>

<!-- Add Habit bottom sheet -->
<div class="modal-overlay" id="addHabitOverlay" hidden>
  <div class="sheet">
    <div class="sheet-handle"></div>
    <h2 class="sheet-title">New Habit</h2>
    <input id="newHabitInput" class="sheet-input" type="text" placeholder="e.g. Drink Water" maxlength="40" />
    <div class="sheet-actions">
      <button class="text-btn" id="cancelAddHabit">Cancel</button>
      <button class="filled-btn" id="confirmAddHabit">Add Habit</button>
    </div>
  </div>
</div>

<!-- Day detail bottom sheet -->
<div class="modal-overlay" id="dayOverlay" hidden>
  <div class="sheet">
    <div class="sheet-handle"></div>
    <h2 class="sheet-title" id="dayModalTitle">—</h2>
    <div class="habit-list" id="dayModalList"></div>
    <div class="sheet-actions">
      <button class="filled-btn" id="closeDayModal">Close</button>
    </div>
  </div>
</div>

<div class="snackbar" id="snackbar"></div>

<script src="app.js"></script>
</body>
</html>
